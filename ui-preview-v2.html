<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Task Manager · Playground V2</title><style>
:root{--ink:#172334;--muted:#64748b;--line:#dce4ed;--blue:#245ec7;--bg:#f4f7fb;--green:#18764d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:white;color:var(--ink)}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}header{position:sticky;top:0;z-index:4;background:#172334;color:white;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:16px}header small{color:#d2dbe8}.shell{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1600px;margin:auto}aside{background:white;border-right:1px solid var(--line);padding:15px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}aside button{display:block;width:100%;text-align:left;border:0;padding:7px 9px;font-size:13px}aside button.active{background:#e7efff;color:#174aa6;font-weight:650}aside summary{font-size:12px;color:var(--muted);font-weight:700;cursor:pointer;margin:14px 0 5px}input{border:1px solid var(--line);padding:9px;border-radius:7px;width:100%;background:white}main{padding:26px;min-width:0;max-width:1260px}h1{font-size:30px;letter-spacing:-.8px;line-height:1.2;margin:8px 0 12px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 6px}.muted{color:var(--muted);font-size:12px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);font-weight:700}.panel{border:1px solid var(--line);border-radius:12px;background:white;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .panel{margin:0}.tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 8px;display:inline-block;color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs button.active{background:#e7efff;color:var(--blue);border-color:#a8bde6}pre{background:#f1f5f9;border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 ui-monospace,monospace;min-height:80px}p{margin:8px 0}.outcome{border-left:4px solid var(--green)}.notice{background:#fff7e5;color:#76531b;padding:10px 14px;border-radius:8px;font-size:12px}.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.node{padding:8px 12px;border:1px solid #c7d8f1;border-radius:7px;background:#edf4ff;font-size:12px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.column{background:#f0f4f8;padding:10px;border-radius:8px;min-height:100px}.task{background:white;border:1px solid var(--line);border-radius:6px;margin:7px 0;padding:8px;font-size:12px}.workspace{display:grid;grid-template-columns:1fr 1.7fr 1.5fr;gap:12px}.workspace .panel{margin:0}.trace-line{border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}.trace-line:before{content:'●';color:var(--green);margin-right:9px}.approval{border:1px solid #e0ba78;border-radius:8px;padding:12px;background:#fffaf0;margin-top:12px}.stat{font-size:24px;font-weight:700}.module-card{cursor:pointer}.module-card:hover{border-color:var(--blue)}@media(max-width:920px){.workspace{grid-template-columns:1fr}.shell{grid-template-columns:200px 1fr}main{padding:15px}.grid{grid-template-columns:1fr}}@media(max-width:600px){.shell{display:block}aside{position:static;height:230px;border-right:0;border-bottom:1px solid var(--line)}header{position:static}h1{font-size:23px}}
</style></head><body><header><strong>◈ Claude Agent Playground <small>V2</small></strong><small>UI prototype · không gọi API · không ghi dữ liệu</small></header><div class="shell"><aside><input id="search" placeholder="Tìm lesson theo ID hoặc tên"><div id="nav"></div></aside><main id="main"></main></div><script>
const lessons=[{"n": "01", "title": "Agent SSE Streaming", "mode": "Offline", "route": "`/`", "api": "`POST /api/sessions/{session_id}/messages` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/agent.py + backend/api.py + frontend/src/app/web.tsx`; FE `frontend/src/app/web.tsx`.", "preset": "Start streaming demo — phát chuỗi text có delay chủ đích.", "ui": "Giữ trang `/` và nút Send; thêm Live text, Final, raw events có timestamp; link Playground; nhãn Offline / timed demonstration.", "flow": "Giữ `agent.py`, `api.py`, `web.tsx`; Agent gọi emit; runner dùng queue.put_nowait; async generator await queue.get rồi yield SSE; FE reader.read + buffer + onEvent; không đưa Anthropic SDK vào bài này. Delay là công cụ minh họa thời gian chứ không giả kết quả LLM.", "outcome": "Phân biệt producer/consumer, Queue nội bộ và SSE qua HTTP; chỉ ra dòng tương đương on-event ở BE và FE; hiểu Agent không cần import web framework.", "accept": "Event hiển thị trước khi lượt chạy hoàn thành; ghép đúng text khi frame bị chia chunk; run_finished đóng stream. Mở Network và thử hai lần gửi, 409 nếu cùng session đang busy.", "checkpoint": "queue.put_nowait có tự gửi HTTP không? Vì sao reader.read cần buffer?"}, {"n": "02", "title": "Session Management", "mode": "Offline", "route": "`/lessons/sessions`", "api": "`POST /api/lessons/sessions` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/sessions.py + existing SessionStore`; FE `frontend/src/app/lessons/sessions/page.tsx`.", "preset": "Tạo session A, B; thêm “Học Python” vào A, “Học TypeScript” vào B.", "ui": "Hai session selector, Create, Send, Inspect; hiển thị id, history, busy và snapshot trước/sau; thử refresh.", "flow": "Tái sử dụng dataclass Session và SessionStore cấp module; dùng default_factory cho list; get trả reference cùng object; minh họa s1 is s2; Queue/Task mới theo turn. History của lesson là dữ liệu runtime cục bộ, không giả Claude nhớ.", "outcome": "Hiểu object reference, session scope và lifecycle; phân biệt state React, session RAM và SQLite durable; không coi session store là LLM memory tự động.", "accept": "Hai ID độc lập; lấy lại cùng ID thấy dữ liệu đã lưu; restart backend mất session RAM; request session không tồn tại trả 404.", "checkpoint": "s1.history.append có ảnh hưởng s2 lấy cùng ID không? Tại sao không tạo store trong endpoint?"}, {"n": "03", "title": "Async Task Management", "mode": "Offline", "route": "`/lessons/async-task`", "api": "`POST /api/lessons/async-task/stream` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/async_task.py + backend/api.py`; FE `frontend/src/app/lessons/async-task/page.tsx`.", "preset": "Chạy cùng một coroutine 3 bước bằng await trực tiếp hoặc create_task.", "ui": "Toggle Await / Create Task; timeline API và worker, elapsed ms, task.done và trạng thái busy; không dùng sleep blocking.", "flow": "Một async def work với await asyncio.sleep ngắn có chủ đích; trong một kịch bản await work trước return, kịch bản còn lại create_task rồi trả SSE; giữ task reference; terminal cleanup rõ. Chỉ dùng một event loop.", "outcome": "Hiểu coroutine, Task, event loop, cooperative scheduling, await và lý do giữ session.task; phân biệt concurrency với parallel CPU execution.", "accept": "Ở chế độ await, response bắt đầu sau khi work xong; create_task cho phép stream khi work đang chạy; chặn hai run cùng session; không tuyên bố tạo thread.", "checkpoint": "create_task trả về gì? await có block toàn server không?"}, {"n": "04", "title": "Human-in-the-loop Approval", "mode": "Offline", "route": "`/approval`", "api": "`POST /api/lessons/approval/stream` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/approvals.py + backend/lessons/approval.py + tools/file_tools.py`; FE `frontend/src/app/approval/page.tsx`.", "preset": "Tạo file notes.md chứa Hello Agent! trong workspace riêng.", "ui": "File Explorer trước/sau, preview nội dung ghi, approval card với Approve/Reject, timeout countdown chỉ minh họa từ server deadline, Reset, trace.", "flow": "`approvals.py`: create_future → register pending → emit approval_required → wait_for → cleanup trong finally. Sau True mới gọi create_file bằng tên cố định trong scope; tránh overwrite bằng exclusive create; reject/timeout không ghi. Approval POST là request khác với SSE.", "outcome": "Hiểu Future một kết quả, approver callback bất đồng bộ, approval_id, sự khác biệt giữa event và quyết định; thấy side effect thật chỉ xảy ra khi được phép.", "accept": "Approve tạo file thật, đọc lại nội dung bằng API; Reject/timeout không tạo; duplicate/stale approval trả 404/409; register Future trước emit; không expose Future object cho FE.", "checkpoint": "Nếu await trước emit thì FE có nút không? Làm sao POST resolve đúng Future?"}, {"n": "05", "title": "Cancel Agent", "mode": "Offline", "route": "`/lessons/cancel`", "api": "`POST /api/lessons/cancel/stream` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/cancel.py + backend/api.py`; FE `frontend/src/app/lessons/cancel/page.tsx`.", "preset": "Đếm số dòng của nhiều file thật theo từng bước có điểm await; bấm Cancel giữa chừng hoặc lúc chờ approval.", "ui": "Run, Cancel, progress từng file, terminal cancelled, kết quả partial có nhãn; hiển thị history trước/sau; so sánh Disconnect (ngắt FE) với Cancel (gửi API).", "flow": "Lưu task trong Session; endpoint hủy đúng run; deny/cleanup pending approval; task.cancel; runner bắt CancelledError, emit error(kind=cancelled) và terminal đúng một lần. Xử lý cancel trước coroutine start; không commit final history nếu cancelled. Đọc file nhỏ bounded, không tuyên bố hủy syscall/thread tức thì.", "outcome": "Hiểu cooperative cancellation, cleanup và run lifecycle; phân biệt AbortController với server cancellation; biết giới hạn hủy tác vụ blocking/đã commit.", "accept": "Cancel trước/sau start và khi pending approval không treo stream; busy trở về false; partial không trở thành final; file đã được đọc không bị sửa; mô tả những side effect đã commit không tự rollback.", "checkpoint": "task.cancel có đảm bảo dừng ngay không? Nếu đóng fetch mà không gọi cancel thì sao?"}, {"n": "06", "title": "Basic Messages API", "mode": "Live", "route": "`/lessons/messages-api`", "api": "`POST /api/lessons/messages-api` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/messages_api.py`; FE `frontend/src/app/lessons/messages-api/page.tsx`.", "preset": "Viết email xin nghỉ phép 1 ngày bằng tiếng Anh.", "ui": "Một prompt editable, system prompt tùy chọn, model read-only từ backend, max_tokens có giới hạn; Run; request/response JSON cạnh nhau; answer và usage.", "flow": "`AsyncAnthropic` + client.messages.create(model, system, max_tokens, messages); serialize response model_dump; lấy text blocks; đo time.perf_counter; REST JSON, không Session/Queue/Agent Loop. Không tự đoán model ID.", "outcome": "Tự gọi Messages API, phân biệt system và message roles, response object, content block, usage, stateless API; biết khi nào một LLM call đủ.", "accept": "Một model request thật khi bấm Run; xem model, content blocks, stop_reason, usage; empty input/missing key lỗi rõ; không expose Authorization.", "checkpoint": "Claude trả content list hay string? Một API call có phải Agent không?"}, {"n": "07", "title": "Multi-turn Conversation", "mode": "Live", "route": "`/lessons/conversation`", "api": "`POST /api/lessons/conversation` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/conversation.py`; FE `frontend/src/app/lessons/conversation/page.tsx`.", "preset": "Tôi đang học Python và thích màu xanh. Sau đó hỏi: Tôi đang học gì?", "ui": "History ON/OFF, hai khung request, editable conversation, Reset, message count; ghi rõ câu trả lời phụ thuộc model.", "flow": "Gửi messages history có user/assistant cho mode ON, mode OFF chỉ gửi question mới. Dùng session riêng hoặc history FE tường minh đã validate; không trộn data giữa lesson. Không dùng SDK resume ở bài này.", "outcome": "Hiểu stateless Messages API, history do app gửi và tác động của context; phân biệt SessionStore với conversation messages.", "accept": "Request ON chứa facts, OFF không; quan sát response thật (không assert từ ngữ chính xác); lỗi API không thêm assistant message giả.", "checkpoint": "Cùng API key có giúp Claude biết request trước không? Tại sao history tăng token?"}, {"n": "08", "title": "Claude Streaming", "mode": "Live", "route": "`/lessons/claude-streaming`", "api": "`POST /api/lessons/claude-streaming/stream` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/claude_streaming.py`; FE `frontend/src/app/lessons/claude-streaming/page.tsx`.", "preset": "Giải thích HTTP và REST cho người mới bằng 5 đoạn ngắn.", "ui": "Upstream Claude events, live text, final message, TTFT, total latency, request inspector; Cancel nếu dùng runtime session; partial/incomplete label.", "flow": "`async with client.messages.stream(...)` và async iteration theo SDK version; phát delta thực tế qua emit → Queue → SSE; get_final_message chỉ khi stream hoàn tất; tách upstream event và application event. Không tạo text chunk giả.", "outcome": "Hiểu hai luồng streaming, async iterator, event mapping và final vs provisional output; biết đo TTFT và tổng latency.", "accept": "Live text nhận trước final; raw events khớp SDK; final message không lấy từ partial UI khi disconnect/error; TTFT đo tới text đầu tiên, n/a nếu không có.", "checkpoint": "Tại sao text_delta chưa là final? Claude streaming và SSE của app có phải cùng kết nối?"}, {"n": "09", "title": "Stop Reason", "mode": "Live", "route": "`/lessons/stop-reason`", "api": "`POST /api/lessons/stop-reason` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/stop_reason.py`; FE `frontend/src/app/lessons/stop-reason/page.tsx`.", "preset": "Giải thích chi tiết cách học Python, so sánh max_tokens thấp và bình thường.", "ui": "Slider max_tokens có cap; preset end_turn / output limit; hiển thị stop_reason, response blocks, incomplete warning; một scenario tool_use sau M3.", "flow": "Gọi messages.create trực tiếp, route display rõ end_turn/max_tokens/tool_use và fallback reason khác (không exhaustive hardcode); stop_reason max_tokens không commit kết quả như hoàn chỉnh; tool_use không tự thực thi ở lesson này.", "outcome": "Hiểu stop_reason biểu diễn lý do dừng model, không phải tất cả đều là final; phân biệt max_tokens output và context limit.", "accept": "Budget thấp có thể gây truncation; nếu model vẫn end_turn ghi nhận thực tế; khi tool scenario model yêu cầu tool thì hiển thị tool block, ghi chưa execute.", "checkpoint": "stop_reason=tool_use có nghĩa tool đã chạy chưa? max_tokens có phải số token input tối đa?"}, {"n": "10", "title": "Token Counting & Usage", "mode": "Live", "route": "`/lessons/token-counting`", "api": "`POST /api/lessons/token-counting` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/token_counting.py`; FE `frontend/src/app/lessons/token-counting/page.tsx`.", "preset": "Nhập văn bản hoặc file Markdown nhỏ; so sánh messages, system và tool definitions.", "ui": "Text area/upload bounded, Count Tokens, Run Claude tùy chọn, bảng input estimate vs actual usage; context budget giải thích bằng số thực.", "flow": "Gọi messages.count_tokens với payload giống request được hỗ trợ; so sánh count estimate với usage trả thật; tính budget input + reserved output + safety margin; lấy model limit từ cấu hình đã xác nhận hoặc metadata hỗ trợ.", "outcome": "Phân biệt token estimate, input/output usage, context budget và max_tokens; hiểu tool schemas cũng tốn context.", "accept": "Count không tạo answer; thêm system/tool schema thấy số đếm thay đổi theo response; nếu budget quá lớn chặn trước generation; không quy đổi ký tự thành exact tokens.", "checkpoint": "Tại sao count và usage có thể khác? Tại sao phải reserve output trước khi gọi?"}, {"n": "11", "title": "API Errors & Retry", "mode": "Hybrid", "route": "`/lessons/api-errors`", "api": "`POST /api/lessons/api-errors` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/api_errors.py`; FE `frontend/src/app/lessons/api-errors/page.tsx`.", "preset": "Một request bình thường; bật fault injection 429/timeout rồi success hoặc non-retryable 400.", "ui": "Live / Controlled fault tabs; bảng attempt, delay, elapsed, error kind; Run ngắn, Cancel; không tự spam API.", "flow": "Map exception SDK cụ thể; chỉ retry transient phù hợp, bounded exponential backoff + jitter và Retry-After khi hỗ trợ; tránh double retry (SDK vs app); fault injection trong adapter có nhãn và không ghi là lỗi thật. Không gửi key sai cố ý ra ngoài; 401/missing config xử lý rõ.", "outcome": "Hiểu transient/permanent errors, retry/backoff, timeout và rate limit; biết tại sao retry write tool có thể tạo duplicate.", "accept": "Fault 429 rồi success thể hiện số attempt/delay thực; 400 không retry; cancel backoff dừng; live success hoặc lỗi thật được phân biệt; không quá ngân sách.", "checkpoint": "401 có nên retry liên tục? Vì sao SDK retry cộng app retry là nguy hiểm?"}, {"n": "12", "title": "Prompt Caching", "mode": "Live", "route": "`/lessons/prompt-caching`", "api": "`POST /api/lessons/prompt-caching` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/prompt_caching.py`; FE `frontend/src/app/lessons/prompt-caching/page.tsx`.", "preset": "Upload tài liệu dài không nhạy cảm, hỏi hai câu khác nhau trên cùng prefix.", "ui": "Chọn cache mode được model hỗ trợ; hai request tự bấm; badge cache creation/read theo usage, comparison latency và token.", "flow": "Giữ stable prefix system/document; dùng caching capability và cú pháp SDK đã xác minh; đảm bảo đủ ngưỡng token và trong lifetime, không giả cache hit; hiển thị cache usage fields thực tế; không dựa vào prefix cache như persistent memory.", "outcome": "Hiểu reusable context prefix, cache write/read, trade-off chi phí và độ trễ; phân biệt cache với history và response cache.", "accept": "Request 1/2 có usage thật; nếu cache_read=0 giải thích ngưỡng/TTL/prefix/model, không coi fail hoặc fake hit; đổi prefix cho thấy behavior khi cache không tái sử dụng.", "checkpoint": "Cache có trả lại nguyên câu trả lời trước không? Thay đổi prefix ảnh hưởng gì?"}, {"n": "13", "title": "Single Tool Calling", "mode": "Live", "route": "`/lessons/tool-calling`", "api": "`POST /api/lessons/tool-calling` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/lessons/tool_calling.py`; FE `frontend/src/app/lessons/tool-calling/page.tsx`.", "preset": "Tính tổng chi phí 120000 + 85000 + 45000 VND.", "ui": "Input amounts, Auto / Force tool (nếu model/API hỗ trợ), hai request/response panels, tool args/result, Actual Result 250000 VND từ Python.", "flow": "Tool sum_expenses(amounts: list[int]) dùng sum; input schema đơn giản giới hạn số phần tử/range; Claude tool_use, validate, dispatch đúng tool; append nguyên assistant blocks và user tool_result có đúng tool_use_id; request tiếp theo nhận final; bài này chỉ một lượt tool, không loop tổng quát.", "outcome": "Phân biệt model yêu cầu hành động và Python thực thi; hiểu tool definition, tool_use, tool_result, ID và hai request.", "accept": "Forced scenario gọi tool nếu được hỗ trợ; Auto có thể không gọi; khi tool chạy, Python result 250000, id khớp; nếu gặp thêm tool_use không coi là final, báo giới hạn bài.", "checkpoint": "Claude có tự chạy sum không? Vì sao gửi cả assistant tool_use trước tool_result?"}, {"n": "14", "title": "Tool Schema & Registry", "mode": "Hybrid", "route": "`/lessons/tool-registry`", "api": "`POST /api/lessons/tool-registry` (các endpoint phụ theo nhu cầu, giữ legacy).", "files": "`backend/tools/registry.py + inputs.py + executor.py`; FE `frontend/src/app/lessons/tool-registry/page.tsx`.", "preset": "Chọn calculate, read_file hoặc list_tasks và nhập JSON arguments.", "ui": "Tool selector, schema JSON, editor, Execute Direct, optional Ask Claude; Actual Result đọc file/list DB/tính số.", "fl const tasks=['Design login UI','Implement login API','Validate email and password','Handle auth errors'];function final(){let yes=decision==='approved'||decision==='report'||decision==='complete'||decision==='report_rejected',report=decision==='complete';return `<div class="eyebrow">Final demo / Claude Agent SDK</div><h1>AI Task Manager</h1><div class="notice">Prototype only — các nút Approval dưới đây chỉ thay đổi trạng thái minh họa trên browser. Không có file/database thật.</div><div class="workspace" style="margin-top:14px">${panel('Files',`<p>📁 documents/</p><p>　 requirements.md</p><p>　 architecture.md</p><p>📁 reports/</p><p>${report?'　 project-plan.md':'　 (empty)'}</p><hr><p class="muted">SQLite: ${yes?4:0} sample tasks</p>`)}${panel('Conversation',`<p><strong>User</strong></p><p>Đọc tài liệu Login, lập danh sách công việc và lưu báo cáo.</p><hr><p><strong>Agent proposal</strong></p>${tasks.map(t=>`<p>• ${t}</p>`).join('')}<div class="approval">${decision==='pending'?'<strong>Approve create_tasks batch?</strong><p>4 proposed records</p><button class="primary" data-decision="approved">Approve tasks</button> <button data-decision="rejected">Reject</button>':decision==='approved'?'<strong>Approve report write?</strong><p>project-plan.md · Markdown</p><button class="primary" data-decision="complete">Approve report</button> <button data-decision="report_rejected">Reject report</button>':`<strong>${decision==='rejected'?'Rejected — no sample changes':report?'Completed (preview)':'Tasks approved; report rejected'}</strong>`}</div><button style="margin-top:10px" data-decision="pending">Reset preview</button>`)}${panel('Actual Result (illustrative)',`<div class="board">${['To do','Doing','Done'].map((n,i)=>`<div class="column"><strong>${n}</strong>${i===0&&yes?tasks.map(t=>`<div class="task">${t}<br><small>High / Medium</small></div>`).join(''):'<p class="muted">Empty</p>'}</div>`).join('')}</div>${report?'<pre># Project Plan\n\n'+tasks.map(t=>'- [ ] '+t).join('\n')+'</pre>':''}`)}</div>${panel('Execution Trace — sample', ['SDK initialized','Read requirements.md and architecture.md','Proposed task plan',decision==='pending'?'Waiting for task approval':decision==='rejected'?'Task approval rejected':'Task approval accepted → SQLite receipts',...(yes?[report?'Report accepted → file receipt':decision==='report_rejected'?'Report approval rejected':'Waiting for report approval']:[]),...(report?['Validated final result']:[])].map(t=>`<div class="trace-line">${t}</div>`).join(''))}${panel('KẾT QUẢ CẦN ĐẠT','Giải thích SDK orchestration, SSE, tool authorization, approval, persistence, evidence validation và vì sao Agent không được tự báo thành công khi chưa có receipt.','outcome')}`}
function render(){let l=lessons.find(x=>x.n===current);if(l)$('main').innerHTML=lesson(l);else if(current==='final')$('main').innerHTML=final();else if(current.startsWith('m')&&current!=='home'){let m=modules[+current.slice(1)];$('main').innerHTML=`<h1>${m[0]} — Recap</h1>${panel('Kết quả cần đạt',m[3],'outcome')}${lessons.filter(l=>+l.n>=m[1]&&+l.n<=m[2]).map(l=>panel(l.n+' · '+esc(l.title),clean(l.outcome)+`<p><button data-go="${l.n}">Review lesson</button></p>`)).join('')}`}else if(current==='engineering')$('main').innerHTML='<h1>Module 9 — Engineering</h1>'+panel('Applied across all lessons','Requirements → acceptance criteria → explicit code → safe configuration → observable verification. No unnecessary framework.');else $('main').innerHTML=home();let b=$('study');if(b)b.onclick=()=>{studied[current]=!studied[current];nav();render()}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.decision){decision=b.dataset.decision;render()}});$('search').addEventListener('input',nav);nav();render();</script></body></html>
